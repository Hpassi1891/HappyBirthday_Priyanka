<!doctype html>
<meta charset="utf-8">
<title>Story storyboard (dev tool)</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 12px; font: 14px system-ui; background: #f4efe8; }
  h3 { margin: 18px 0 6px; } .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .f { width: 230px; background: #fff; border: 1px solid #ccc; } .f svg { width: 100%; display: block; } .f small { display: block; text-align: center; color: #888; }
</style>
<!-- Open http://localhost:8000/tools/storyboard.html?per=6 to see a few moments from every shot while editing js/lib/story.js -->
<div id="out"></div>
<script type="module">
  import { SHOTS, renderShot } from '../js/lib/story.js';
  const per = +(new URLSearchParams(location.search).get('per') || 6);
  const only = new URLSearchParams(location.search).get('shot');
  let html = '';
  SHOTS.forEach((s, si) => {
    if (only && s.id !== only) return;
    html += `<h3>${si + 1}. ${s.id} · ${s.dur}s</h3><div class="row">`;
    for (let i = 0; i < per; i++) {
      const t = (i / Math.max(1, per - 1)) * (s.dur - 0.01);
      html += `<div class="f">${renderShot(si, t)}<small>${t.toFixed(1)}s</small></div>`;
    }
    html += '</div>';
  });
  document.getElementById('out').innerHTML = html;
</script>
